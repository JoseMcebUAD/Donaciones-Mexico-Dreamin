<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Video essay de Jose Manuel Ceballos Medina.">
    <meta name="theme-color" content="#0b1220">
    <title>Video essay | Jose Manuel Ceballos Medina</title>
    <style>
      :root {
        color-scheme: dark;
        --surface: rgba(15, 23, 42, 0.82);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #38bdf8;
        --border: rgba(148, 163, 184, 0.28);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(1.25rem, 4vw, 4rem);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 0%, #164e63 0, transparent 32rem),
          radial-gradient(circle at 95% 100%, #312e81 0, transparent 38rem),
          #0b1220;
      }

      main {
        width: min(100%, 70rem);
        padding: clamp(1.25rem, 4vw, 3.5rem);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        background: var(--surface);
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--accent);
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 20ch;
        margin: 0;
        font-size: clamp(2rem, 6vw, 4.5rem);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      .intro {
        max-width: 65ch;
        margin: 1.25rem 0 2rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.65;
      }

      .video-frame {
        overflow: hidden;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: #020617;
        box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.3);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .support {
        margin: 1.5rem 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        color: var(--text);
        font-weight: 700;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 0.14em;
        text-underline-offset: 0.2em;
      }

      a:hover { color: var(--accent); }
      a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

      @media (max-width: 480px) {
        main { border-radius: 1rem; }
        .video-frame { border-radius: 0.65rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Mexico Dreamin</p>
      <h1>Video essay</h1>
      <p class="intro">Jose Manuel Ceballos Medina</p>

      <div class="video-frame">
        <iframe
          src="https://www.youtube-nocookie.com/embed/4NwdNJMHC8o"
          title="Video essay de Jose Manuel Ceballos Medina"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <p class="support">
        Si el reproductor no carga, puedes
        <a href="https://youtu.be/4NwdNJMHC8o" target="_blank" rel="noopener noreferrer">abrir el video en YouTube</a>.
      </p>
    </main>
  </body>
</html>
