<template>
    <lightning-card title="Recognition wall" icon-name="utility:heart">
        <div class="slds-p-around_medium">
            <template if:true={hasDonors}>
                <ul class="slds-list_dotted">
                    <template for:each={donors} for:item="donor">
                        <li key={donor.Id}>{donor.Donor_Name__c} — <lightning-formatted-number value={donor.Amount__c} format-style="currency" currency-code="MXN"></lightning-formatted-number></li>
                    </template>
                </ul>
            </template>
            <template if:false={hasDonors}>
                <p>There are no public recognitions yet.</p>
            </template>
            <template if:true={error}><p class="slds-text-color_error">{error}</p></template>
        </div>
    </lightning-card>
</template>
