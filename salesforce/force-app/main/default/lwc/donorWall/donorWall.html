<template>
    <template if:true={hasAnyDonors}>
    <lightning-card title="Wall of Fame" icon-name="utility:heart">
        <div class="wall">
            <template if:true={hasDonors}>
                <ul class="donor-grid">
                    <template for:each={donors} for:item="donor">
                        <li key={donor.id} class="donor-card">
                            <template if:true={donor.imageUrl}>
                                <img src={donor.imageUrl} alt={donor.imageAlt} class="donor-image" />
                            </template>
                            <template if:false={donor.imageUrl}>
                                <div class="donor-placeholder" aria-hidden="true">{donor.initial}</div>
                            </template>
                            <div>
                                <p class="donor-type">{donor.recognitionTypeLabel}</p>
                                <p class="donor-name">{donor.displayName}</p>
                                <lightning-formatted-number value={donor.amount} format-style="currency" currency-code="MXN"></lightning-formatted-number>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
            <template if:true={hasAnonymousDonors}>
                <p class="slds-m-top_x-small slds-text-color_weak">{anonymousLabel}</p>
            </template>
            <template if:false={hasAnyDonors}>
                <p>Aún no hay reconocimientos públicos.</p>
            </template>
        </div>
    </lightning-card>
    </template>
</template>
